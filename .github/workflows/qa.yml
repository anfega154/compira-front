name: CI frontend

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, coverage and production build
    runs-on: ubuntu-latest
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Validate a local frontend build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1
          VITE_OTP_RESEND_COOLDOWN_SECONDS: '120'

  deploy:
    name: Deploy frontend to AWS QA
    needs: quality
    if: github.ref == 'refs/heads/qa' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: frontend-deploy-qa
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_OTP_RESEND_COOLDOWN_SECONDS: '120'
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a superseded QA revision
        run: |
          test "$(git ls-remote origin refs/heads/qa | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate cloud build configuration
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          u=urllib.parse.urlparse(os.environ['VITE_API_URL'])
          assert u.scheme == 'https' and u.hostname and u.path.endswith('/api/v1'), 'VITE_API_URL must be the HTTPS API URL ending in /api/v1'
          assert u.hostname not in {'localhost','127.0.0.1'} and not u.query and not u.fragment
          PY
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Publish assets then HTML and invalidate CloudFront
        run: bash scripts/deploy/qa-frontend.sh
