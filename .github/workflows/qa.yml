name: CI frontend

on:
  pull_request:
    branches: [dev, qa]
  push:
    branches: [dev, qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, coverage and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Validate a local frontend build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1
          VITE_OTP_RESEND_COOLDOWN_SECONDS: '120'
